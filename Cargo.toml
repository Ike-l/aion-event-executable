[package]
name = "aion-event-executable"
version = "0.1.0"
edition = "2024"

[dependencies]
aion-event = { path = "../../aion-event" }
aion-program = { path = "../../aion-program" }
aion-processor = { path = "../../aion-processor" }
aion-ecs = { path = "../../aion-ecs", optional = true }

hecs = { version = "0.11.0" }

small_derive_deref = { version = "0.1.4", optional = true }
tokio = { version = "1.52.3", optional = true }

[features]
# default = []

