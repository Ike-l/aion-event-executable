# default = ["pipeline-events"]
# default = ["event-reactors"]
# default = ["load-pipeline-resources"]

# default = ["processing", "pipeline-events"]
# default = ["processing", "event-reactors"]
# default = ["processing", "load-pipeline-resources"]
# default = ["pipeline-events", "event-reactors"]
# default = ["pipeline-events", "load-pipeline-resources"]
# default = ["load-pipeline-resources", "event-reactors"]

# default = ["processing", "pipeline-events", "event-reactors"]
# default = ["processing", "pipeline-events", "load-pipeline-resources"]
# default = ["processing", "event-reactors", "load-pipeline-resources"]
# default = ["pipeline-events", "event-reactors", "load-pipeline-resources"]

default = ["processing", "pipeline-events", "event-reactors", "load-pipeline-resources"]

any = ["tokio", "aion-ecs"]

processing = ["any"]
pipeline-events = ["any"]
event-reactors = ["any"]
load-pipeline-resources = ["any", "small_derive_deref"]